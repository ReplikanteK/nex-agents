name: agent3 daily wake

on:
  schedule:
    # 3:33 AM hora española (CEST = UTC+2) → 1:33 UTC
    - cron: '33 1 * * *'
  workflow_dispatch:

jobs:
  wake-agent3:
    runs-on: ubuntu-latest
    steps:
      - name: Start codespace
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          CODESPACE=$(curl -s -H "Authorization: Bearer $GH_PAT" \
            "https://api.github.com/user/codespaces" \
            | jq -r '.codespaces[] | select(.repository.name == "nex-agents" and (.state == "Shutdown" or .state == "shutdown")) | .name' \
            | head -1)

          if [ -z "$CODESPACE" ]; then
            echo "[agent3] No codespace to wake"
            exit 0
          fi

          echo "[agent3] Waking: $CODESPACE"
          curl -s -X POST -H "Authorization: Bearer $GH_PAT" \
            "https://api.github.com/user/codespaces/$CODESPACE/start"
          echo "[agent3] ✅ Started — @reboot cron ejecutará entrypoint.sh"
