name: agent3 daily wake

on:
  push:
    branches: [main]
  schedule:
    - cron: '33 1 * * *'
  workflow_dispatch:

env:
  GH_PAT: ${{ secrets.GH_PAT }}

jobs:
  wake-agent3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start or create agent3 codespace
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "[agent3] Looking for stopped codespace..."

          CODESPACE=$(gh api /user/codespaces --jq \
            '.codespaces[] | select(.repository.name == "nex-agents" and .state == "Shutdown") | .name' \
            | head -1)

          if [ -n "$CODESPACE" ]; then
            echo "[agent3] Starting: $CODESPACE"
            gh api -X POST "/user/codespaces/$CODESPACE/start"
          else
            echo "[agent3] No stopped codespace — creating new one..."
            CREATE_JSON=$(gh api -X POST /user/codespaces \
              --field "repository_id=1246782009" \
              --field "ref=main" \
              --field "geo=EuropeWest" \
              --field "machine=basicLinux32gb" \
              --field "idle_timeout_minutes=5" 2>&1)
            if echo "$CREATE_JSON" | grep -q "message.*error\|message.*Invalid\|422"; then
              echo "[agent3] Failed to create: $CREATE_JSON"
              exit 1
            fi
            CODESPACE=$(echo "$CREATE_JSON" | gh api -X POST /user/codespaces \
              -f repository_id=1246782009 -f ref=main \
              -f geo=EuropeWest -f machine=basicLinux32gb \
              -f idle_timeout_minutes=5 --jq '.name' 2>&1)
            echo "[agent3] Created: $CODESPACE"
          fi

          echo "[agent3] Waiting for Available (up to 5 min)..."
          for i in $(seq 1 30); do
            STATE=$(gh api "/user/codespaces/$CODESPACE" --jq '.state')
            echo "  attempt $i: $STATE"
            [ "$STATE" = "Available" ] && break
            sleep 10
          done

          [ "$STATE" != "Available" ] && echo "[agent3] Not ready after 5 min" && exit 1

          echo "[agent3] Running entrypoint..."
          gh codespace ssh -c "$CODESPACE" -- \
            "cd /workspaces/nex-agents && bash setup/entrypoint.sh $GH_PAT" 2>&1

          echo "[agent3] Done"
