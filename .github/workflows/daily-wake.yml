name: agent3 daily wake

on:
  push:
    branches: [main]
  schedule:
    - cron: '33 1 * * *'
  workflow_dispatch:

env:
  GH_PAT: ${{ secrets.GH_PAT }}

jobs:
  wake-agent3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start or create agent3 codespace
        run: |
          echo "[agent3] Looking for stopped codespace..."

          CODESPACE=$(curl -s -H "Authorization: Bearer $GH_PAT" \
            "https://api.github.com/user/codespaces" \
            | jq -r '.codespaces[] | select(.repository.name == "nex-agents" and (.state == "Shutdown" or .state == "shutdown")) | .name' \
            | head -1)

          if [ -n "$CODESPACE" ]; then
            echo "[agent3] Found stopped: $CODESPACE"
            curl -s -X POST -H "Authorization: Bearer $GH_PAT" \
              "https://api.github.com/user/codespaces/$CODESPACE/start"
          else
            echo "[agent3] No stopped codespace — creating new one..."
            CREATE_RESULT=$(curl -s -X POST -H "Authorization: Bearer $GH_PAT" \
              -H "Content-Type: application/json" \
              -d '{"repository_id":"","ref":"main","geo":"EuropeWest","machine":"basicLinux32gb","idle_timeout_minutes":5}' \
              "https://api.github.com/user/codespaces")
            CODESPACE=$(echo "$CREATE_RESULT" | jq -r '.name // empty')
            if [ -z "$CODESPACE" ]; then
              echo "[agent3] Failed to create codespace:"
              echo "$CREATE_RESULT" | jq '.message // .'
              exit 1
            fi
            echo "[agent3] Created codespace: $CODESPACE"
          fi

          echo "[agent3] Waiting for Available (up to 5 min)..."
          for i in $(seq 1 30); do
            STATE=$(curl -s -H "Authorization: Bearer $GH_PAT" \
              "https://api.github.com/user/codespaces/$CODESPACE" | jq -r '.state')
            echo "  attempt $i: $STATE"
            [ "$STATE" = "Available" ] && break
            sleep 10
          done

          [ "$STATE" != "Available" ] && echo "[agent3] Not ready after 5 min" && exit 1

          echo "[agent3] Running entrypoint via SSH..."
          GH_TOKEN="$GH_PAT" gh codespace ssh -c "$CODESPACE" -- \
            "cd /workspaces/nex-agents && bash setup/entrypoint.sh $GH_PAT" 2>&1

          echo "[agent3] Done"
