name: agent3 daily wake

on:
  push:
    branches: [main]
  schedule:
    - cron: '33 1 * * *'
  workflow_dispatch:

env:
  GH_PAT: ${{ secrets.GH_PAT }}

jobs:
  wake-agent3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find or create agent3 codespace
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "[agent3] Looking for codespace..."

          CODESPACE=$(gh api /user/codespaces --jq \
            '.codespaces[] | select(.repository.name == "nex-agents") | .name' \
            | head -1)

          if [ -n "$CODESPACE" ]; then
            STATE=$(gh api "/user/codespaces/$CODESPACE" --jq '.state')
            echo "[agent3] Found: $CODESPACE (state: $STATE)"
            if [ "$STATE" = "Shutdown" ]; then
              echo "[agent3] Starting..."
              gh api -X POST "/user/codespaces/$CODESPACE/start"
            fi
          else
            echo "[agent3] No codespace — creating one..."
            gh api -X POST /user/codespaces --input - <<JSON > /dev/null
{"repository_id":1246782009,"ref":"main","geo":"EuropeWest","machine":"basicLinux32gb","idle_timeout_minutes":5}
JSON
            sleep 5
            CODESPACE=$(gh api /user/codespaces --jq \
              '.codespaces[] | select(.repository.name == "nex-agents") | .name' \
              | tail -1)
            STATE=$(gh api "/user/codespaces/$CODESPACE" --jq '.state')
            echo "[agent3] Created: $CODESPACE (state: $STATE)"
          fi

          if [ "$STATE" != "Available" ]; then
            echo "[agent3] Waiting for Available (up to 5 min)..."
            for i in $(seq 1 30); do
              sleep 10
              STATE=$(gh api "/user/codespaces/$CODESPACE" --jq '.state')
              echo "  attempt $i: $STATE"
              [ "$STATE" = "Available" ] && break
            done
          fi

          [ "$STATE" != "Available" ] && echo "[agent3] Not ready" && exit 1

          echo "[agent3] Running entrypoint..."
          gh codespace ssh -c "$CODESPACE" -- \
            "cd /workspaces/nex-agents && bash setup/entrypoint.sh $GH_PAT" 2>&1

          echo "[agent3] Done"
