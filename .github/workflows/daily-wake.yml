name: agent3 daily wake

on:
  schedule:
    - cron: '33 1 * * *'
  workflow_dispatch:

env:
  GH_PAT: ${{ secrets.GH_PAT }}

jobs:
  # Job 1: Enrichment (runs on ubuntu-latest - FREE)
  enrich:
    runs-on: ubuntu-latest
    outputs:
      top_score: ${{ steps.enrich.outputs.top_score }}
      top_name: ${{ steps.enrich.outputs.top_name }}
      has_target: ${{ steps.enrich.outputs.has_target }}
    steps:
      - uses: actions/checkout@v5

      - name: Run enrichment
        id: enrich
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          chmod +x setup/enrich.sh
          bash setup/enrich.sh "$GH_PAT"
          
          # Extract outputs
          TOP_SCORE=$(jq -r '.top_candidate.score // 0' memoria/agent3-latest.json 2>/dev/null || echo 0)
          TOP_NAME=$(jq -r '.top_candidate.name // ""' memoria/agent3-latest.json 2>/dev/null || echo "")
          
          echo "top_score=$TOP_SCORE" >> "$GITHUB_OUTPUT"
          echo "top_name=$TOP_NAME" >> "$GITHUB_OUTPUT"
          
          if [ "$TOP_SCORE" -ge 50 ]; then
            echo "has_target=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_target=false" >> "$GITHUB_OUTPUT"
          fi
          
          echo "[enrich] Score: $TOP_SCORE, Target: $TOP_NAME"

  # Job 2: Execute (runs on codespace - only if target ≥ 65)
  execute:
    needs: enrich
    if: needs.enrich.outputs.has_target == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cleanup orphan codespaces
        continue-on-error: true
        run: |
          echo "[agent3] Cleaning orphan codespaces..."
          gh api /user/codespaces --jq '.codespaces[] | select(.repository.name == "nex-agents" and (.state == "Available" or .state == "Queued")) | .name' 2>/dev/null | while read CS; do
            [ -n "$CS" ] && gh api -X POST "/user/codespaces/$CS/stop" > /dev/null && echo "[agent3] Stopped orphan: $CS"
          done

      - name: Run agent3 execute
        id: agent3
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          CS=$(gh api /user/codespaces --jq '.codespaces[] | select(.repository.name == "nex-agents") | .name' | head -1)
          if [ -z "$CS" ]; then
            echo "[agent3] Creating codespace..."
            CS=$(echo '{"repository_id":1246782009,"ref":"main","geo":"EuropeWest","machine":"basicLinux32gb","idle_timeout_minutes":30}' | gh api /user/codespaces --input - -X POST --jq '.name')
            echo "[agent3] Created: $CS"
          else
            ST=$(gh api "/user/codespaces/$CS" --jq '.state')
            while [ "$ST" = "ShuttingDown" ]; do sleep 10; ST=$(gh api "/user/codespaces/$CS" --jq '.state'); done
            [ "$ST" = "Shutdown" ] && gh api -X POST "/user/codespaces/$CS/start" > /dev/null
          fi

          echo "[agent3] Waiting for Available..."
          for i in $(seq 1 45); do
            ST=$(gh api "/user/codespaces/$CS" --jq '.state')
            echo "[agent3] $i: $ST"
            [ "$ST" = "Available" ] && break
            sleep 10
          done
          [ "$ST" != "Available" ] && echo "[agent3] Timeout" && exit 1

          echo "[agent3] Running entrypoint (execute only)..."
          # Run only the task execution part, skip enrichment
          timeout 900 gh codespace ssh -c "$CS" -- "cd /workspaces/nex-agents && git fetch origin && git reset --hard origin/main && bash setup/execute.sh $GH_PAT" 2>&1
          echo "[agent3] Done"

      - name: Always cleanup
        if: always()
        continue-on-error: true
        run: |
          echo "[agent3] Final cleanup..."
          gh api /user/codespaces --jq '.codespaces[] | select(.repository.name == "nex-agents" and (.state == "Available" or .state == "Queued")) | .name' 2>/dev/null | while read CS; do
            [ -n "$CS" ] && gh api -X POST "/user/codespaces/$CS/stop" > /dev/null && echo "[agent3] Cleaned: $CS"
          done

      - name: Create failure issue
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "agent3: execute failed $(date +%Y-%m-%d)" \
            --body "Agent3 execute job failed at $(date -u +%Y-%m-%dT%H:%M:%SZ). Check workflow logs." \
            --label "bug" 2>/dev/null || true

  # Job 3: Light day (no target, just report)
  light-day:
    needs: enrich
    if: needs.enrich.outputs.has_target == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Generate light report
        run: |
          DOW=$(date +%u)
          DATE=$(date +%Y-%m-%d)
          
          if [ "$DOW" -eq 5 ]; then
            echo "[light-day] Friday - creating maintenance task"
            cat > "tasks/maintenance-${DATE}.md" << 'EOF'
          # Task: Weekly maintenance
          ### Origen: agent3 (auto)
          ### Prioridad: media
          ### Estado: pending
          ### Iniciado: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          
          ### Objetivo
          1. Revisa reportes activos pendientes
          2. Resume cambios semanales en bounty landscape
          3. Deja brief para agent1
          Output: reports/maintenance-${DATE}.md
          EOF
          else
            echo "[light-day] No target with score ≥65. Light day."
          fi
          
          git add tasks/ 2>/dev/null || true
          if ! git diff --cached --quiet 2>/dev/null; then
            git -c user.name="enrich-bot" -c user.email="enrich@nex.local" commit -m "light-day: ${DATE}" 2>/dev/null || true
            git push origin main 2>/dev/null || true
          fi
