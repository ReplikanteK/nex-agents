name: agent3 daily wake

on:
  schedule:
    - cron: '33 1 * * *'
  workflow_dispatch:

concurrency:
  group: agent3-wake
  cancel-in-progress: true

env:
  GH_PAT: ${{ secrets.GH_PAT }}

jobs:
  wake-agent3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cleanup orphan codespaces
        continue-on-error: true
        run: |
          echo "[agent3] Cleaning orphan codespaces..."
          gh api /user/codespaces --jq '.codespaces[] | select(.repository.name == "nex-agents" and (.state == "Available" or .state == "Queued")) | .name' 2>/dev/null | while read CS; do
            [ -n "$CS" ] && gh api -X POST "/user/codespaces/$CS/stop" > /dev/null && echo "[agent3] Stopped orphan: $CS"
          done

      - name: Run agent3
        id: agent3
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          CS=$(gh api /user/codespaces --jq '.codespaces[] | select(.repository.name == "nex-agents") | .name' | head -1)
          if [ -z "$CS" ]; then
            echo "[agent3] Creating codespace..."
            CS=$(echo '{"repository_id":1246782009,"ref":"main","geo":"EuropeWest","machine":"basicLinux32gb","idle_timeout_minutes":30}' | gh api /user/codespaces --input - -X POST --jq '.name')
            echo "[agent3] Created: $CS"
          else
            ST=$(gh api "/user/codespaces/$CS" --jq '.state')
            while [ "$ST" = "ShuttingDown" ]; do sleep 10; ST=$(gh api "/user/codespaces/$CS" --jq '.state'); done
            [ "$ST" = "Shutdown" ] && gh api -X POST "/user/codespaces/$CS/start" > /dev/null
          fi

          echo "[agent3] Waiting for Available..."
          for i in $(seq 1 45); do
            ST=$(gh api "/user/codespaces/$CS" --jq '.state')
            echo "[agent3] $i: $ST"
            [ "$ST" = "Available" ] && break
            sleep 10
          done
          [ "$ST" != "Available" ] && echo "[agent3] Timeout" && exit 1

          echo "[agent3] Running entrypoint..."
          timeout 1500 gh codespace ssh -c "$CS" -- "cd /workspaces/nex-agents && bash setup/entrypoint.sh $GH_PAT" 2>&1
          echo "[agent3] Done"

      - name: Always cleanup
        if: always()
        continue-on-error: true
        run: |
          echo "[agent3] Final cleanup..."
          gh api /user/codespaces --jq '.codespaces[] | select(.repository.name == "nex-agents" and (.state == "Available" or .state == "Queued")) | .name' 2>/dev/null | while read CS; do
            [ -n "$CS" ] && gh api -X POST "/user/codespaces/$CS/stop" > /dev/null && echo "[agent3] Cleaned: $CS"
          done

      - name: Create failure issue
        if: failure()
        continue-on-error: true
        run: |
          gh issue create \
            --title "agent3: run failed $(date +%Y-%m-%d)" \
            --body "Agent3 daily run failed at $(date -u +%Y-%m-%dT%H:%M:%SZ). Check workflow logs." \
            --label "bug"
