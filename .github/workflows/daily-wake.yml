name: agent3 daily wake

on:
  push:
    branches: [main]
  schedule:
    - cron: '33 1 * * *'
  workflow_dispatch:

env:
  GH_PAT: ${{ secrets.GH_PAT }}

jobs:
  wake-agent3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find codespace
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          CODESPACE=$(gh api /user/codespaces --jq '.codespaces[] | select(.repository.name == "nex-agents") | .name' | head -1)
          echo "CODESPACE=$CODESPACE" >> $GITHUB_ENV

      - name: Start if Shutdown
        if: env.CODESPACE != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          STATE=$(gh api "/user/codespaces/${{ env.CODESPACE }}" --jq '.state')
          echo "STATE=$STATE" >> $GITHUB_ENV
          echo "[agent3] Found: ${{ env.CODESPACE }} (state: $STATE)"
          if [ "$STATE" = "Shutdown" ]; then
            gh api -X POST "/user/codespaces/${{ env.CODESPACE }}/start"
          elif [ "$STATE" = "Available" ]; then
            echo "[agent3] Already running"
          fi

      - name: Create if no codespace
        if: env.CODESPACE == ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "[agent3] No codespace. Creating..."
          gh api -X POST /user/codespaces -f repository_id=1246782009 -f ref=main -f geo=EuropeWest -f machine=basicLinux32gb -f idle_timeout_minutes=5

      - name: Wait for Available
        if: env.CODESPACE != '' && env.STATE != 'Available'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          for i in $(seq 1 15); do
            sleep 20
            STATE=$(gh api "/user/codespaces/${{ env.CODESPACE }}" --jq '.state')
            echo "  attempt $i: $STATE"
            [ "$STATE" = "Available" ] && exit 0
          done
          echo "[agent3] Timeout" && exit 1

      - name: Run entrypoint
        if: env.CODESPACE != '' && env.STATE == 'Available'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "[agent3] Running entrypoint..."
          gh codespace ssh -c "${{ env.CODESPACE }}" -- "cd /workspaces/nex-agents && bash setup/entrypoint.sh $GH_PAT" 2>&1
          echo "[agent3] Done"
